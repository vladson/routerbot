[advisories]
db-urls = ["https://github.com/RustSec/advisory-db"]
ignore = [
    # Transitive build-time dependency of teloxide 0.17 through aquamarine.
    # No safe upgrade is available for RUSTSEC-2026-0173.
    "RUSTSEC-2026-0173",
]

[licenses]
allow = [
    "0BSD",
    "Apache-2.0",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[[licenses.exceptions]]
allow = ["Apache-2.0 WITH LLVM-exception"]
crate = "ar_archive_writer"

[[licenses.exceptions]]
allow = ["MPL-2.0"]
crate = "colored"

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-git = []
