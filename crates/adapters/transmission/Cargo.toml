[package]
name = "routerbot-adapter-transmission"
description = "Transmission RPC adapter for Routerbot."
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
base64 = "=0.22.1"
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
routerbot-app = { version = "0.1.0", path = "../../app" }
routerbot-core = { version = "0.1.0", path = "../../core" }
thiserror = "=2.0.18"
transmission-rpc = { version = "=0.5.0", features = ["sync"] }

[dev-dependencies]
tokio = { version = "=1.53.1", features = ["macros", "rt-multi-thread"] }

[lints]
workspace = true
